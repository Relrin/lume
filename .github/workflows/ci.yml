name: CI

on:
  push:
    branches: [master]
  pull_request:
  # The release workflow runs these checks in full before it publishes anything.
  workflow_call:
    inputs:
      release:
        description: Run as the release's gate, without the benchmarks and the bundles
        type: boolean
        default: false

# Called by the release workflow, `github.workflow` is the caller's name, so a release's
# checks never cancel, nor are cancelled by, the checks of a push to the same branch.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  # Linux system packages Tauri and bindgen need. Windows and macOS runners have theirs.
  #
  # The steps that open the application's window on Linux run it on a virtual display
  # and on a session bus of their own (`xvfb-run -a dbus-run-session --`). The runner's
  # own session bus offers desktop services that have no desktop to run on; a program
  # that asks one of them waits until the call times out, which takes far longer than
  # the application's whole start.
  LINUX_PACKAGES: >-
    build-essential curl file xz-utils libclang-dev xvfb dbus
    libwebkit2gtk-4.1-dev libxdo-dev libssl-dev libayatana-appindicator3-dev librsvg2-dev

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - name: Install system packages
        run: sudo apt-get update && sudo apt-get install -y $LINUX_PACKAGES
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4.3.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version-file: .node-version
          cache: pnpm
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - name: Cache pinned tools and libghostty-vt builds
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: |
            .tools
            vendor/ghostty
            target/vt
            packages/vt/dist
          key: vt-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('tools.toml') }}
      - uses: taiki-e/install-action@893d6ee8d714b6c7dfe2bcd94e5759e9a7958a7e # v2.90.10
        with:
          tool: cargo-deny@0.20.2
      - run: cargo xtask setup
      - run: cargo xtask vt wasm
      - run: cargo xtask lint
      # Every shipped crate, package and component has an allowed licence and its text,
      # for each platform a release is built for. Reading the dependency graph for
      # another platform needs no build for it.
      - name: Third-party notices
        run: |
          for target in x86_64-pc-windows-msvc x86_64-unknown-linux-gnu aarch64-apple-darwin x86_64-apple-darwin; do
            cargo xtask notices --target "$target"
          done

  build-test:
    name: Build and test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - name: Install system packages
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y $LINUX_PACKAGES
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4.3.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version-file: .node-version
          cache: pnpm
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - name: Cache pinned tools and libghostty-vt builds
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: |
            .tools
            vendor/ghostty
            target/vt
            packages/vt/dist
          key: vt-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('tools.toml') }}
      - name: Setup (pinned Zig, libghostty-vt source, JS dependencies)
        run: cargo xtask setup
      - name: Build
        run: cargo xtask build
      - name: Test
        run: cargo xtask test
      # An updated application finds the host the previous release left running. The
      # step says so and passes while no release has such a host.
      - name: Backend against the previous release's host
        shell: bash
        run: |
          git fetch --tags --force --quiet || true
          cargo xtask compat --latest-release
      # Start the app, let the page check the webview, print the report and exit.
      - name: Probe the webview (Linux)
        if: runner.os == 'Linux'
        run: xvfb-run -a dbus-run-session -- target/debug/lume-gui --probe
      - name: Probe the webview (Windows, macOS)
        if: runner.os != 'Linux'
        shell: bash
        run: target/debug/lume-gui --probe

      # The suites that need the application's window: the corpus and the renderer
      # snapshots inside its webview, then real shells driven through `lume ctl`.
      - name: End to end (Linux)
        if: runner.os == 'Linux'
        run: xvfb-run -a dbus-run-session -- cargo xtask e2e
      - name: End to end (Windows, macOS)
        if: runner.os != 'Linux'
        run: cargo xtask e2e
      # What the suites reported and drew. For a webview engine with no reference
      # pictures yet, this holds the pictures references would be made from.
      - name: Keep what the suites produced
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: harness-${{ matrix.os }}
          path: target/harness
          if-no-files-found: ignore

      # The control endpoint belongs to one user: another cannot reach it, and the
      # console command refuses one that another user made.
      - name: Endpoint against another user (Linux)
        if: runner.os == 'Linux'
        run: xvfb-run -a sh tests/endpoint/cross-user.sh target/debug/lume-gui target/debug/lume
      - name: Endpoint against another user (macOS)
        if: runner.os == 'macOS'
        run: sh tests/endpoint/cross-user.sh target/debug/lume-gui target/debug/lume
      - name: Endpoint against another user (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: tests/endpoint/cross-user.ps1 -App target/debug/lume-gui.exe -Lume target/debug/lume.exe

      # Typing through the window itself. WebDriver for the application exists for
      # Windows and Linux.
      - name: Install the WebDriver bridge
        if: runner.os != 'macOS'
        run: cargo install tauri-driver --version 2.1.0 --locked
      # The webview's own driver, which the bridge talks to. Installed here and not with
      # the packages every job needs: only this test uses it, and a job that does not
      # should not fail when the package is renamed, as it has been before.
      - name: Install the webview's WebDriver (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get install -y webkitgtk-webdriver
      - name: Smoke test through WebDriver (Linux)
        if: runner.os == 'Linux'
        run: xvfb-run -a dbus-run-session -- cargo xtask smoke
      - name: Smoke test through WebDriver (Windows)
        if: runner.os == 'Windows'
        run: cargo xtask smoke
      # The window as the smoke test saw it, with two panes, in the dark look and in
      # the light. For people to look at: nothing compares them.
      - name: Keep the pictures of the window
        if: always() && runner.os != 'macOS'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: window-${{ matrix.os }}
          path: target/smoke
          if-no-files-found: warn

  bench:
    name: Benchmarks (${{ matrix.os }})
    # Not a gate for a release: shared runners measure too unevenly to hold one back.
    if: ${{ !inputs.release }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - name: Install system packages
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y $LINUX_PACKAGES
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4.3.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version-file: .node-version
          cache: pnpm
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - name: Cache pinned tools and libghostty-vt builds
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: |
            .tools
            vendor/ghostty
            target/vt
            packages/vt/dist
          key: vt-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('tools.toml') }}
      - run: cargo xtask setup
      # Shared runners have no GPU and uneven neighbours: the limits here catch a change
      # that makes something several times slower, and nothing finer.
      - name: Measure against the CI limits (Linux)
        if: runner.os == 'Linux'
        run: xvfb-run -a dbus-run-session -- cargo xtask bench --profile ci
      - name: Measure against the CI limits (Windows, macOS)
        if: runner.os != 'Linux'
        run: cargo xtask bench --profile ci
      - name: Keep the numbers
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: bench-${{ matrix.os }}
          path: target/bench
          if-no-files-found: ignore

  dist:
    name: Bundles (${{ matrix.os }})
    # What a user would be given to run, from every commit that lands on the main branch.
    # A release publishes the source alone, so it does not wait for them.
    if: ${{ github.event_name == 'push' && !inputs.release }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - name: Install system packages
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y $LINUX_PACKAGES
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4.3.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version-file: .node-version
          cache: pnpm
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - name: Cache pinned tools and libghostty-vt builds
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: |
            .tools
            vendor/ghostty
            target/vt
            packages/vt/dist
          key: vt-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('tools.toml') }}
      - run: cargo xtask setup
      - name: Build the portable archive and the installers
        run: cargo xtask dist --installers
      - name: Keep the bundles
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: lume-${{ matrix.os }}
          path: |
            target/dist/*.zip
            target/dist/*.tar.gz
            target/dist/*.exe
            target/dist/*.dmg
            target/dist/*.AppImage
            target/dist/*.deb
            target/dist/*.rpm
            target/dist/SHA256SUMS
            target/dist/THIRD-PARTY-NOTICES.txt
          if-no-files-found: error
