[workspace]
resolver = "3"
members = ["crates/*", "xtask"]

[workspace.package]
version = "0.0.0"
edition = "2024"
rust-version = "1.100"
license = "Apache-2.0"
repository = "https://github.com/Relrin/lume"
publish = false

[workspace.dependencies]
# First-party crates. Add an entry when another crate first depends on one.
lume-host = { path = "crates/lume-host" }
lume-ipc = { path = "crates/lume-ipc" }
lume-proto = { path = "crates/lume-proto" }
lume-pty = { path = "crates/lume-pty" }
lume-session = { path = "crates/lume-session" }
lume-vt-sys = { path = "crates/lume-vt-sys" }

# Third-party
anyhow = "1"
arboard = { version = "3.7", default-features = false }
async-trait = "0.1"
bindgen = "0.73"
fontdb = "0.24"
getrandom = "0.3"
libc = "0.2"
portable-pty = "0.9"
proptest = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.11"
static_vcruntime = "3"
tauri = "2"
tauri-build = "2"
thiserror = "2"
tokio = { version = "1", features = ["io-util", "macros", "net", "rt-multi-thread", "sync", "time"] }
toml = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", default-features = false, features = ["fmt", "std"] }
ureq = "3"
url = "2"
windows-sys = "0.61"

[workspace.lints.rust]
unsafe_op_in_unsafe_fn = "deny"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }

[profile.release]
lto = "thin"
codegen-units = 1
strip = "symbols"
