[workspace]
resolver = "3"
members = ["crates/*", "xtask"]

[workspace.package]
version = "0.0.0"
edition = "2024"
rust-version = "1.100"
license = "Apache-2.0"
repository = "https://github.com/Relrin/lume"
publish = false

[workspace.dependencies]
# First-party crates. Add an entry when another crate first depends on one.
lume-vt-sys = { path = "crates/lume-vt-sys" }

# Third-party
anyhow = "1"
bindgen = "0.73"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.11"
tauri = "2"
tauri-build = "2"
toml = "1"
ureq = "3"

[workspace.lints.rust]
unsafe_op_in_unsafe_fn = "deny"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }

[profile.release]
lto = "thin"
codegen-units = 1
strip = "symbols"
