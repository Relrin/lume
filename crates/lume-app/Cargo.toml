[package]
name = "lume-app"
description = "The Lume application: windows, webviews, and the commands the web UI may call."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true
build = "build.rs"

[[bin]]
name = "lume-gui"
path = "src/main.rs"

[dependencies]
arboard.workspace = true
async-trait.workspace = true
fontdb.workspace = true
getrandom.workspace = true
lume-config.workspace = true
lume-ipc.workspace = true
lume-layout.workspace = true
lume-plugin.workspace = true
lume-plugin-api.workspace = true
lume-plugin-runtime.workspace = true
lume-services.workspace = true
lume-proto.workspace = true
lume-pty.workspace = true
lume-rex.workspace = true
lume-session.workspace = true
notify.workspace = true
serde.workspace = true
serde_json.workspace = true
tauri.workspace = true
tauri-plugin-dialog.workspace = true
tauri-plugin-notification.workspace = true
thiserror.workspace = true
tokio.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
url.workspace = true
zeroize.workspace = true

# On Linux the clipboard is reached through X11 by default; this adds the Wayland way.
[target.'cfg(all(unix, not(target_os = "macos")))'.dependencies]
arboard = { workspace = true, features = ["wayland-data-control"] }

[target.'cfg(windows)'.dependencies]
windows-sys = { workspace = true, features = [
    "Win32_Foundation",
    "Win32_Graphics_Dwm",
    "Win32_System_Registry",
    "Win32_UI_Shell",
    "Win32_UI_WindowsAndMessaging",
] }

[build-dependencies]
tauri-build.workspace = true

# What the pretend Rex server of `lume-rex` is made of, which the tests run against.
[dev-dependencies]
data-encoding.workspace = true
futures-util.workspace = true
rcgen.workspace = true
rustls.workspace = true
tokio = { workspace = true, features = ["test-util"] }
tokio-rustls.workspace = true
tokio-tungstenite.workspace = true

[lints]
workspace = true

[features]
# Serve the built UI from the binary instead of the Vite dev server. `tauri build` and
# `cargo xtask build` turn this on; `tauri dev` leaves it off.
custom-protocol = ["tauri/custom-protocol"]
