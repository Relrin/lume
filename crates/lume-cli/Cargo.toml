[package]
name = "lume-cli"
description = "The lume console command: launcher, ctl, and the commands on the configuration."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true
build = "build.rs"

[dependencies]
lume-config.workspace = true
lume-ipc.workspace = true
lume-plugin.workspace = true
lume-proto.workspace = true
serde_json.workspace = true
tokio.workspace = true
zeroize.workspace = true

[target.'cfg(windows)'.dependencies]
windows-sys = { workspace = true, features = [
  "Win32_Foundation",
  "Win32_Globalization",
  "Win32_Storage_FileSystem",
  "Win32_System_Console",
  "Win32_System_IO",
] }

[target.'cfg(unix)'.dependencies]
libc.workspace = true

[build-dependencies]
static_vcruntime.workspace = true

[lints]
workspace = true

[[bin]]
name = "lume"
path = "src/main.rs"
