# Lume configuration.
#
# Every setting is optional. The lines below show each setting at its default, commented
# out: remove the `#` and change the value to set one. The file is read again whenever
# it is saved, and a mistake in it is reported without anything being changed.
#
# A workspace can override any of this in `workspaces/<name>.toml` beside this file.

# The profile new terminals use: the id of a profile (profiles are described at the end
# of this file). Left empty, new terminals run the shell of `terminal.shell`.
# default-profile = ""

[app]
# Keep the application running when its last window closes.
# keep-running = false
# The workspace opened at start: a name, or "last" for the one open when Lume closed.
# start-workspace = "last"

[window]
# Who draws the title bar: "custom" (Lume, as part of its top bar) or "system". Left
# out, Lume draws it on Windows and macOS and the window system does on Linux.
#   title-bar = "custom"
# Close a window when its last tab closes.
# close-with-last-tab = true
# Whether closing a window asks first: "never" or "always".
# confirm-close = "never"
# Open windows where they were when the workspace was last open.
# restore-bounds = true
# Flash the taskbar button (or bounce the dock icon) when a program rings the bell in a
# window that is not in use.
# bell-attention = true
# How round the corners of a window's own frame are, where the system lets Lume choose
# (Windows 11): "round", "small" or "square".
# corners = "round"

[workspace]
# What happens to a workspace's programs when another workspace is opened: "close"
# ends them, "keep" keeps them running for when the workspace is opened again.
# on-switch = "close"

[host]
# Where the programs in the terminals run: "in-process", inside Lume, so that they end
# with it, or "daemon", in a session host of their own that keeps them running after
# Lume closes and shows them again when it starts. Read when Lume starts.
# mode = "in-process"
# With "daemon": how long, in seconds, the session host stays with no window and no
# running program before it exits. 0 keeps it running.
# idle-exit = 60

[appearance]
# The theme, whatever the system's colour scheme is. Left out, the theme follows the
# system and is one of the two below. Built in are "lume-dark" and "lume-midnight"
# (dark), and "lume-light" and "lume-daylight" (light); your own go in the `themes`
# folder beside this file, and are taken up as soon as they are saved.
#   theme = "lume-dark"
# theme-light = "lume-light"
# theme-dark = "lume-dark"
# The colour focus, the selected tab, selected text and the window's glow are drawn in:
# "mint", "blue", "lilac", "amber", "coral" or "graphite", or a colour of your own
# written "#rrggbb". Left out, the theme's.
#   accent = "blue"
# The radius of the corners of panes (and of menus and palettes), of controls (tabs,
# buttons, fields and menu items), and the space between panes, in pixels. Left out, the
# theme decides. 0 makes them square.
#   card-radius = 12
#   control-radius = 8
#   gap = 8
# When a pane shows its header: "always", "auto" (only beside other panes) or "never".
# pane-header = "always"
# How much a pane without the focus is dimmed, from 0 to 1. Left out, the theme decides.
#   dim-unfocused = 0.15
# A picture behind the panes, how much it is blurred (pixels) and how opaque it is.
#   background-image = "C:/Users/me/Pictures/wallpaper.jpg"
#   background-blur = 0
#   background-opacity = 1.0
# The tile a pane's header and its tab show for a program, by the program's name. A
# kind of program: "terminal", "editor", "git", "monitor", "agent", "remote",
# "container" or "files"; or a well-known one, such as "claude", "neovim", "python",
# "postgres", "terraform" or "ubuntu" (the settings schema lists them all). A shell
# shows the prompt unless its own mark is chosen: "bash", "zsh", "fish" or "nushell".
#   program-icons = { nvim = "editor", ipython = "python", zsh = "zsh" }
# Which program tiles are drawn in colour: "always", "active-pane", "active-tab" or
# "never". The others are drawn in the theme's muted ink.
# tile-color = "always"
# How the highlight moves when another tab is shown: "glow", "glide", "stretch",
# "spring" or "instant", or a plugin's, written "<plugin>/<motion>". It moves at once
# for the keyboard and with reduced motion.
# tab-highlight = "glow"
# Motion plugins bring for other places in the window, each "<plugin>/<motion>":
# menu-enter, toast-enter, toast-exit, palette-enter, panel-enter, float-enter,
# pill-enter and status-change. A place left out moves as Lume's own does.
#   motion = { menu-enter = "acme.motion/pop" }
#
# Any design token can be set over the theme's, in a table named after its group:
#
#   [appearance.tokens.color]
#   accent = "#ff8800"

[font]
# The font of terminals, and the fonts tried after it.
# family = "JetBrains Mono"
# fallback = ["Cascadia Mono", "Consolas", "Menlo", "DejaVu Sans Mono", "monospace"]
# The size in pixels, and the height of a line as a multiple of it.
# size = 14.0
# line-height = 1.2
# The weights of ordinary and bold text.
# weight = 400
# bold-weight = 700
# The font and size of everything that is not a terminal. Inter comes with Lume;
# "system-ui" is the system's own.
# ui-family = "Inter"
# ui-size = 12.0

[terminal]
# The program a new terminal runs, and its arguments. Empty, it is your own shell.
# shell = ""
# shell-args = []
# How many lines that have scrolled off the top are kept.
# scrollback-lines = 10000
# Whether windows keep only the newest lines and fetch older ones from the session host
# when you scroll back to them or search; how many lines a window keeps itself then (100
# or more); and for how many seconds it keeps the lines it fetched once you are back at
# the newest output (5 or more). Off, every window keeps all of the scrollback itself.
# history-paging = false
# window-history-lines = 1000
# history-release-seconds = 60
# Whether a pane out of sight, in a tab not on show or a float put down, lets go of its
# copy of the screen and gets it back from the session host when it is shown again; and
# after how many seconds out of sight (5 or more).
# hidden-release = false
# hidden-release-seconds = 30
# The cursor: "block", "bar" or "underline", and whether it blinks.
# cursor-style = "block"
# cursor-blink = true
# What the cursor leaves behind when it jumps or moves to another pane: "none", "warp",
# "sweep" or "comet"; and what it gives off when it changes shape or moves to another
# pane: "none", "burst", "ripple", "box-burst" or "box-ripple". A plugin's effect is
# written "<plugin>/<effect>". Both are off while the system asks for less motion. How long they last against their own length, from 0.25
# to 3.
# cursor-trail = "none"
# How the cursor itself moves as one types or moves it: "none" (at once), "glide" or
# "glide-slow" (it slides to its new place), or a plugin's effect, "<plugin>/<effect>".
# Off while the system asks for less motion.
# cursor-motion = "none"
# cursor-pulse = "none"
# cursor-effect-length = 1.0
# The space between a pane's edge and its text, in pixels. Left out, the theme decides.
#   padding = 4
# What happens to a pane when its program ends: "clean" (close if it ended without an
# error), "always" or "never".
# close-on-exit = "clean"
# Whether closing a pane asks first: "never" or "always".
# confirm-close = "never"
# Copy text to the clipboard as soon as it is selected with the pointer.
# copy-on-select = false
# A desktop notification when a command ends in a window that is not in use, if it ran
# for at least this many seconds (5 or more). It needs the shell to report its commands.
# notify-long-command = false
# long-command-seconds = 10

[layout]
# Where the list of tabs is: "top", "left" or "right".
# tab-placement = "top"
# Where a new pane's program starts: "inherit" (where the shell of the pane it is
# opened from is, if that shell says; otherwise as "workspace"), "workspace" (the
# workspace's folder) or "home".
# new-pane-cwd = "inherit"
# What happens to a tab opened from a layout file (in the `layouts` folder beside this
# file) when the file is saved again: "ask", "always" or "never". Programs still running
# in panes the file no longer has are put away, never ended.
# files-reapply = "ask"

[renderer]
# What terminals are drawn with: "auto", "webgpu", "webgl2" or "canvas2d".
# tier = "auto"

[ssh]
# Let terminals to one machine share a connection, so that only the first has to sign
# in. It applies to the hosts listed from your OpenSSH configuration, and only where the
# OpenSSH client can do it, which the one that comes with Windows cannot.
# connection-sharing = true
# How long a shared connection is kept after its last terminal closes, as OpenSSH's
# ControlPersist takes it: "10m", "yes", "no".
# control-persist = "10m"

[rex]
# Look for the Rex server of your account on this computer, where servers are listed.
# One that runs is listed; none is ever started.
# local = true
# The server a session of which is shown when Lume starts: its address, or its label.
# Signing in may be asked for; if that is put away, your workspace stays.
# start-on = ""
# Rex servers elsewhere are [[rex.host]] tables. An address is "https://HOST[:PORT]",
# "http://HOST[:PORT]", "tailnet://HOST:PORT", "ssh://[USER@]HOST[:PORT]" or a host
# alone, which is tried the safest way first:
#
#   [[rex.host]]
#   label = "build"
#   address = "ssh://me@build.example"

[keybindings]
# A key is a chord such as "ctrl+shift+t", or several chords separated by spaces. Its
# value is a command's id, or a table that also says where the key holds:
#
#   "ctrl+shift+t" = "lume.tab.new"
#   "ctrl+a c" = "lume.tab.new"
#   "ctrl+shift+f" = { command = "lume.search.open", when = "terminal" }
#
# "unbound" takes a default away:
#
#   "ctrl+shift+k" = "unbound"
#
# `lume keymap` prints every key that is bound and where its binding comes from.
# Bindings for one platform go in [keybindings.windows], [keybindings.macos] or
# [keybindings.linux].

# Profiles are ways to start a terminal. Lume makes one for every shell it finds, for
# every WSL distribution and for every host of your OpenSSH configuration; `lume ctl
# profiles` lists them with their ids. A profile of your own is a [[profile]] table:
#
#   [[profile]]
#   id = "work"
#   name = "Work box"
#   launcher = "ssh"          # "shell", "wsl" or "ssh"
#   host = "work.example"     # ssh: a name from your OpenSSH configuration, or a host
#   user = "me"               # ssh and wsl
#   port = 2222               # ssh
#
#   [[profile]]
#   id = "scratch"
#   launcher = "shell"
#   program = "nu"            # left out, your own shell
#   args = ["--login"]
#   cwd = "~/scratch"
#   env = { EDITOR = "hx" }
#   close-on-exit = "never"   # instead of terminal.close-on-exit
#
# Other keys: icon, login (shell), distro (wsl), extra-args and client (ssh), theme,
# font-size, shell-integration ("auto" or "off") and hidden. A table with the id of a
# profile Lume made changes that profile, and needs only what it changes:
#
#   [[profile]]
#   id = "auto.wsl.Ubuntu"
#   user = "root"
