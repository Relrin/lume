# The built-in dark theme.
#
# A theme sets design tokens: the token `color.surface` is the key `surface` in the
# table `[color]`. A theme of your own goes in the `themes` folder beside config.toml.
# It needs only the tokens it changes; the rest come from the built-in theme of its
# scheme, or from the theme it names with `inherits`.

name = "Lume Dark"
scheme = "dark"

[color]
surface = "#0e1015"
card = "#1c1f2a"
card-header = "#1c1f2a"
border = "#2c3142"
border-focus = "#7fb4f0"
text = "#dfe3ee"
text-muted = "#9097ab"
text-inverse = "#14161d"
accent = "#7fb4f0"
accent-text = "#14161d"
control = "#14161d"
control-hover = "#2c3142"
control-active = "#596079"
popover = "#1c1f2a"
overlay = "#00000073"
drop-preview = "#7fb4f040"

[color.status]
info = "#7fb4f0"
success = "#7ee0a0"
warning = "#e6c384"
danger = "#f0908a"

[terminal]
fg = "#dfe3ee"
bg = "#14161d"
cursor = "#dfe3ee"
cursor-text = "#14161d"
selection = "#2f4f8f"
selection-text = "#dfe3ee"
search-match = "#e6c38466"
search-active = "#e6c384"
# The sixteen ANSI colours: eight normal, then eight bright.
palette = [
    "#1c1f2a", "#f0908a", "#7ee0a0", "#e6c384", "#7fb4f0", "#c4a0f0", "#6fd3d6", "#c5cada",
    "#596079", "#ff9d94", "#98ecb4", "#f2d49b", "#9cc7ff", "#d6b8ff", "#8ce4e6", "#ffffff",
]

# Lengths are in pixels.
[space]
gap = 8
padding = 4

[radius]
card = 12
control = 8

[size]
header = 28
topbar = 36
tab = 28
border = 1
focus-ring = 2

[opacity]
dim = 0.15
disabled = 0.5
background-image = 1.0

# A shadow is "x y blur spread colour"; several are separated by commas.
[shadow]
card = "0 1 3 0 #00000040"
card-focus = "0 0 0 2 #7fb4f0"
floating = "0 8 24 0 #00000080"
popover = "0 12 32 0 #00000099"

[background]
image = ""
blur = 0
