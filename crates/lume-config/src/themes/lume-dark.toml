# The built-in dark theme.
#
# A theme sets design tokens: the token `color.surface` is the key `surface` in the
# table `[color]`. A theme of your own goes in the `themes` folder beside config.toml.
# It needs only the tokens it changes; the rest come from the built-in theme of its
# scheme, or from the theme it names with `inherits`.

name = "Lume Dark"
scheme = "dark"

[color]
surface = "#121416"
card = "#171a1e"
card-header = "#171a1e"
border = "#262b31"
border-focus = "#7fe3b899"
text = "#e6e8ea"
text-muted = "#9aa3ab"
text-inverse = "#0f1113"
accent = "#7fe3b8"
accent-text = "#0f1113"
control = "#14171a"
control-hover = "#ffffff12"
control-active = "#1e2227"
popover = "#1c2024"
overlay = "#00000080"
drop-preview = "#7fe3b814"

[color.status]
info = "#7aa7ff"
success = "#8fd694"
warning = "#f0b35a"
danger = "#ff8b82"

[terminal]
fg = "#d7dadd"
bg = "#171a1e"
cursor = "#7fe3b8"
cursor-text = "#0f1113"
selection = "#2b4a40"
selection-text = "#e6e8ea"
search-match = "#f0b35a66"
search-active = "#f0b35a"
# The sixteen ANSI colours: eight normal, then eight bright.
palette = [
    "#23282d", "#ff8b82", "#8fd694", "#f0b35a", "#82aaff", "#c792ea", "#7fdbca", "#d7dadd",
    "#5d666f", "#ffa59e", "#a9e3ad", "#f5c880", "#a3c1ff", "#d7b0f0", "#a1e8dc", "#ffffff",
]

# Lengths are in pixels.
[space]
gap = 8
padding = 8

[radius]
card = 10
control = 8

[size]
header = 34
topbar = 44
tab = 30
border = 1
focus-ring = 1

[opacity]
dim = 0.0
disabled = 0.5
background-image = 1.0

# A shadow is "x y blur spread colour"; several are separated by commas.
[shadow]
card = "0 4 16 0 #00000040"
card-focus = "0 0 0 1 #7fe3b833, 0 8 24 0 #00000059"
floating = "0 28 70 0 #00000099"
popover = "0 18 50 0 #00000080, 0 2 6 0 #00000040"

[background]
image = ""
blur = 0
