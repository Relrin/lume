# The built-in light theme. See lume-dark.toml for how a theme is written.

name = "Lume Light"
scheme = "light"

[color]
surface = "#e6e9ef"
card = "#ffffff"
card-header = "#f6f7fa"
border = "#cfd4df"
border-focus = "#2f6fd0"
text = "#1c1f2a"
text-muted = "#5b6275"
text-inverse = "#ffffff"
accent = "#2f6fd0"
accent-text = "#ffffff"
control = "#f1f3f7"
control-hover = "#e2e5ec"
control-active = "#c9cedb"
popover = "#ffffff"
overlay = "#1c1f2a59"
drop-preview = "#2f6fd033"

[color.status]
info = "#2f6fd0"
success = "#1f8a4c"
warning = "#a36a00"
danger = "#c2392f"

[terminal]
fg = "#1c1f2a"
bg = "#ffffff"
cursor = "#1c1f2a"
cursor-text = "#ffffff"
selection = "#bcd4f6"
selection-text = "#1c1f2a"
search-match = "#f2c94c80"
search-active = "#f2a100"
palette = [
    "#1c1f2a", "#c2392f", "#1f8a4c", "#a36a00", "#2f6fd0", "#8a4fc7", "#0f8a8f", "#737a8c",
    "#596079", "#de4a3f", "#27a85c", "#c08400", "#4a86e0", "#a368dd", "#18a3a8", "#8f96a8",
]

[space]
gap = 8
padding = 4

[radius]
card = 12
control = 8

[size]
header = 28
topbar = 36
tab = 28
border = 1
focus-ring = 2

[opacity]
dim = 0.1
disabled = 0.5
background-image = 1.0

[shadow]
card = "0 1 3 0 #1c1f2a26"
card-focus = "0 0 0 2 #2f6fd0"
floating = "0 8 24 0 #1c1f2a40"
popover = "0 12 32 0 #1c1f2a4d"

[background]
image = ""
blur = 0
