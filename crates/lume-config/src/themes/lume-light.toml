# The built-in light theme. See lume-dark.toml for how a theme is written.

name = "Lume Light"
scheme = "light"

[color]
surface = "#e6e9ef"
card = "#ffffff"
card-header = "#f6f7fa"
border = "#cfd4df"
border-focus = "#2f6fd0"
text = "#1c1f2a"
text-muted = "#5b6275"
text-inverse = "#ffffff"
accent = "#2f6fd0"
accent-text = "#ffffff"
control = "#f1f3f7"
control-hover = "#e2e5ec"
control-active = "#c9cedb"
popover = "#ffffff"
overlay = "#1c1f2a59"
drop-preview = "#2f6fd033"

[color.status]
info = "#2f6fd0"
success = "#1f8a4c"
warning = "#a36a00"
danger = "#c2392f"

# The colours a tab or a group of tabs can be given.
[color.tab]
red = "#c2392f"
orange = "#b35c00"
yellow = "#8f6a00"
green = "#1f8a4c"
teal = "#0f8a8f"
blue = "#2f6fd0"
purple = "#8a4fc7"
pink = "#c2407e"

[terminal]
fg = "#1c1f2a"
bg = "#ffffff"
cursor = "#1c1f2a"
cursor-text = "#ffffff"
selection = "#bcd4f6"
selection-text = "#1c1f2a"
search-match = "#f2c94c80"
search-active = "#f2a100"
palette = [
    "#1c1f2a", "#c2392f", "#1f8a4c", "#a36a00", "#2f6fd0", "#8a4fc7", "#0f8a8f", "#737a8c",
    "#596079", "#de4a3f", "#27a85c", "#c08400", "#4a86e0", "#a368dd", "#18a3a8", "#8f96a8",
]

[space]
gap = 8
padding = 8

[radius]
card = 10
control = 8

[size]
header = 34
topbar = 44
tab = 30
border = 1
focus-ring = 1

[opacity]
dim = 0.0
disabled = 0.5
background-image = 1.0

[shadow]
card = "0 4 16 0 #1c1f2a1f"
card-focus = "0 0 0 1 #2f6fd033, 0 8 24 0 #1c1f2a2e"
floating = "0 8 24 0 #1c1f2a40"
popover = "0 12 32 0 #1c1f2a4d"

[background]
image = ""
blur = 0

# How long motion takes, in milliseconds, and the curves it eases along. Lume sets
# every duration to nought while the system asks for less motion.
[motion.duration]
instant = 40
fast = 120
base = 160
slow = 220

[motion.easing]
standard = "cubic-bezier(0.23, 1, 0.32, 1)"
emphasized = "cubic-bezier(0.34, 1.56, 0.64, 1)"
exit = "ease-out"
