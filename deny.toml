# cargo-deny configuration: licence allow-list and advisory checks.

[graph]
targets = [
  "x86_64-pc-windows-msvc",
  "x86_64-unknown-linux-gnu",
  "aarch64-apple-darwin",
  "x86_64-apple-darwin",
]

[advisories]
version = 2
yanked = "deny"

[licenses]
version = 2
confidence-threshold = 0.9
# Permissive licences only. No GPL, LGPL or AGPL code may reach the shipped binary.
allow = [
  "Apache-2.0",
  "Apache-2.0 WITH LLVM-exception",
  "BSD-2-Clause",
  "BSD-3-Clause",
  "BSL-1.0",
  "CC0-1.0",
  # A permissive licence for data. Used by webpki-roots (the CA list), which only xtask
  # pulls in for its HTTPS downloads; it is not part of the shipped app.
  "CDLA-Permissive-2.0",
  "ISC",
  "MIT",
  "MIT-0",
  "Unicode-3.0",
  "Zlib",
  # MPL-2.0 is file-level copyleft: it covers changes to the MPL files themselves, not code
  # that links them. Tauri's HTML and CSS parsing dependencies use it. Allowed for that
  # reason; remove it if the project decides to exclude all copyleft, file-level included.
  "MPL-2.0",
]

[bans]
multiple-versions = "allow"
wildcards = "deny"
allow-wildcard-paths = true

[sources]
unknown-registry = "deny"
unknown-git = "deny"
