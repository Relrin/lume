# The limits the benchmarks are held to. `cargo xtask bench` measures the release build
# and fails when a number is outside its limit.
#
# A table is a profile; `cargo xtask bench --profile <name>` picks one. Each entry names
# a number by its path in the benchmark report (target/bench/report.json):
#
#   max       the number must not be above this
#   min       the number must not be below this
#   unit      what the number is counted in
#   optional  a report without the number passes (a webview may lack a renderer tier)
#
# Times are in milliseconds. p95 and p99 are the values 95 and 99 samples in a hundred
# stay under.

# The limits the product is built to, on the hardware it was measured on: a desktop with
# a discrete GPU and a 144 Hz display.
[reference]

# A full redraw of a 200 by 60 screen, until the GPU has finished it.
"redraw.webgpu.finish.p95" = { max = 4.0, unit = "ms", optional = true }
"redraw.webgl2.finish.p95" = { max = 8.0, unit = "ms", optional = true }
# The last tier has one frame at 60 Hz to draw in.
"redraw.canvas2d.finish.p95" = { max = 16.6, unit = "ms" }

# A flood from a session to the page, with nothing done to the bytes.
"transport.mibPerSecond" = { min = 50.0, unit = "MiB/s" }

# From a key being sent to its echo arriving, with nothing else going on: typed in a
# burst, and typed with a pause before each key.
"echoBurst.p99" = { max = 5.0, unit = "ms" }
"echoSpaced.p99" = { max = 5.0, unit = "ms" }
# The same while another session floods.
"flood.echo.p99" = { max = 10.0, unit = "ms" }

# A terminal drawn every frame while a flood is written into it.
"flood.framesPerSecond" = { min = 60.0, unit = "frames/s" }
"flood.inputToFrame.p95" = { max = 50.0, unit = "ms" }

# From the start of the application to the first output of its shell reaching the page.
# What follows, until the prompt, is the shell's own start and is recorded only.
"startup.outputMs.p50" = { max = 1000.0, unit = "ms" }
# What twenty installed plugins that do not run add to that: pairs of starts, one
# without them and one with, and the top of the span the middle difference is sure
# within. Nothing of a plugin is read before the first output.
"startup.plugins.differenceMs.high" = { max = 25.0, unit = "ms" }
"startup.plugins.filesBeforeOutput" = { max = 0.0, unit = "files" }

# How often the window's components are drawn again because a terminal printed. A
# terminal's output is drawn outside them, so the answer is never.
"chrome.outputCommits" = { max = 0.0, unit = "renders" }

# Sixteen panes in four tabs, all printing, four of them on show: the frames the page
# is given each second, on each tier the webview offers.
"panes16.webgpu.framesPerSecond" = { min = 60.0, unit = "frames/s", optional = true }
"panes16.webgl2.framesPerSecond" = { min = 60.0, unit = "frames/s", optional = true }
"panes16.canvas2d.framesPerSecond" = { min = 60.0, unit = "frames/s" }

# A divider dragged to and fro between two panes that print.
"drag.framesPerSecond" = { min = 60.0, unit = "frames/s" }

# From a tab being asked for to its four panes being drawn again, where every pane
# builds its glyphs anew: the middle one of several switches.
"tabSwitch.webgl2Ms" = { max = 50.0, unit = "ms", optional = true }

# A scrollback of a hundred thousand lines searched for a text on one line in a hundred:
# until every line has been looked at, and the longest the search kept the page from
# anything else on the way.
"search.completeMs" = { max = 600.0, unit = "ms" }
"search.maxSliceMs" = { max = 12.0, unit = "ms" }

# The cursor's effects drawn over a window-sized canvas, each on its own, until the
# GPU has finished a frame of it. Canvas 2D is the fallback where WebGL2 is not had.
"cursorFx.webgl2.warp.finish.p95" = { max = 2.0, unit = "ms", optional = true }
"cursorFx.webgl2.sweep.finish.p95" = { max = 2.0, unit = "ms", optional = true }
"cursorFx.webgl2.comet.finish.p95" = { max = 2.0, unit = "ms", optional = true }
"cursorFx.webgl2.burst.finish.p95" = { max = 2.0, unit = "ms", optional = true }
"cursorFx.webgl2.ripple.finish.p95" = { max = 2.0, unit = "ms", optional = true }
"cursorFx.webgl2.box-burst.finish.p95" = { max = 2.0, unit = "ms", optional = true }
"cursorFx.webgl2.box-ripple.finish.p95" = { max = 2.0, unit = "ms", optional = true }
"cursorFx.canvas2d.warp.finish.p95" = { max = 4.0, unit = "ms" }
"cursorFx.canvas2d.sweep.finish.p95" = { max = 4.0, unit = "ms" }
"cursorFx.canvas2d.comet.finish.p95" = { max = 4.0, unit = "ms" }
"cursorFx.canvas2d.burst.finish.p95" = { max = 4.0, unit = "ms" }
"cursorFx.canvas2d.ripple.finish.p95" = { max = 4.0, unit = "ms" }
"cursorFx.canvas2d.box-burst.finish.p95" = { max = 4.0, unit = "ms" }
"cursorFx.canvas2d.box-ripple.finish.p95" = { max = 4.0, unit = "ms" }

# Two panes whose cursor jumps every 50 ms while the keyboard moves between them every
# 300 ms, with a comet and a ripple playing: the frames the page is given.
"cursorJumps.on.framesPerSecond" = { min = 60.0, unit = "frames/s" }
"cursorJumps.on.frameInterval.p99" = { max = 20.0, unit = "ms" }

# A view started from a session that has printed ten thousand lines and more, the copy
# of the screen the session host sends loaded with every line of it. Making the copy and
# loading it are held to 50 ms. The whole, from asking to attach to holding the loaded
# terminal, also counts the copy's way to the page, which goes at the carrier's speed
# (a 3.6 MB copy took 37 ms of 58) and has a limit of its own. The lines are counted so
# that the numbers cannot quietly come from a shallower scrollback.
"hydrate.madeAndLoaded.p50" = { max = 50.0, unit = "ms" }
"hydrate.attach.p50" = { max = 100.0, unit = "ms" }
"hydrate.lines" = { min = 9000.0, unit = "lines" }
# The session host's copy of that screen and a view's together, over the host's alone,
# when the view keeps only the newest lines and fetches the rest as needed. A view that
# keeps every line, which is the default, holds a second whole copy; that ratio is in the
# report and is not held to a limit.
"hydrate.memory.pagedRatio" = { max = 1.5, unit = "x" }

# Shared CI runners: no GPU, a virtual display, and neighbours. These limits catch a
# change that makes something several times slower, and nothing finer than that.
[ci]

"redraw.webgpu.finish.p95" = { max = 40.0, unit = "ms", optional = true }
"redraw.webgl2.finish.p95" = { max = 80.0, unit = "ms", optional = true }
"redraw.canvas2d.finish.p95" = { max = 160.0, unit = "ms" }
"transport.mibPerSecond" = { min = 8.0, unit = "MiB/s" }
"echoBurst.p99" = { max = 50.0, unit = "ms" }
"echoSpaced.p99" = { max = 50.0, unit = "ms" }
"flood.echo.p99" = { max = 100.0, unit = "ms" }
"flood.framesPerSecond" = { min = 10.0, unit = "frames/s" }
"flood.inputToFrame.p95" = { max = 500.0, unit = "ms" }
"startup.outputMs.p50" = { max = 10000.0, unit = "ms" }
"startup.plugins.differenceMs.high" = { max = 500.0, unit = "ms" }
"startup.plugins.filesBeforeOutput" = { max = 0.0, unit = "files" }
"chrome.outputCommits" = { max = 0.0, unit = "renders" }
"panes16.webgpu.framesPerSecond" = { min = 10.0, unit = "frames/s", optional = true }
"panes16.webgl2.framesPerSecond" = { min = 10.0, unit = "frames/s", optional = true }
"panes16.canvas2d.framesPerSecond" = { min = 10.0, unit = "frames/s" }
"drag.framesPerSecond" = { min = 10.0, unit = "frames/s" }
"tabSwitch.webgl2Ms" = { max = 500.0, unit = "ms", optional = true }
"search.completeMs" = { max = 15000.0, unit = "ms" }
"search.maxSliceMs" = { max = 120.0, unit = "ms" }
"cursorFx.webgl2.warp.finish.p95" = { max = 20.0, unit = "ms", optional = true }
"cursorFx.webgl2.sweep.finish.p95" = { max = 20.0, unit = "ms", optional = true }
"cursorFx.webgl2.comet.finish.p95" = { max = 20.0, unit = "ms", optional = true }
"cursorFx.webgl2.burst.finish.p95" = { max = 20.0, unit = "ms", optional = true }
"cursorFx.webgl2.ripple.finish.p95" = { max = 20.0, unit = "ms", optional = true }
"cursorFx.webgl2.box-burst.finish.p95" = { max = 20.0, unit = "ms", optional = true }
"cursorFx.webgl2.box-ripple.finish.p95" = { max = 20.0, unit = "ms", optional = true }
"cursorFx.canvas2d.warp.finish.p95" = { max = 40.0, unit = "ms" }
"cursorFx.canvas2d.sweep.finish.p95" = { max = 40.0, unit = "ms" }
"cursorFx.canvas2d.comet.finish.p95" = { max = 40.0, unit = "ms" }
"cursorFx.canvas2d.burst.finish.p95" = { max = 40.0, unit = "ms" }
"cursorFx.canvas2d.ripple.finish.p95" = { max = 40.0, unit = "ms" }
"cursorFx.canvas2d.box-burst.finish.p95" = { max = 40.0, unit = "ms" }
"cursorFx.canvas2d.box-ripple.finish.p95" = { max = 40.0, unit = "ms" }
"cursorJumps.on.framesPerSecond" = { min = 10.0, unit = "frames/s" }
"cursorJumps.on.frameInterval.p99" = { max = 200.0, unit = "ms" }
"hydrate.madeAndLoaded.p50" = { max = 500.0, unit = "ms" }
"hydrate.attach.p50" = { max = 1000.0, unit = "ms" }
"hydrate.lines" = { min = 9000.0, unit = "lines" }
"hydrate.memory.pagedRatio" = { max = 1.5, unit = "x" }
