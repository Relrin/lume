# Pinned external tools. The single place these versions change.
# `cargo xtask setup` downloads each archive, checks its SHA-256 and unpacks it.
# Nothing here is ever taken from the system: a system Zig is not used.

[ghostty-vt]
# libghostty-vt release. Native and WASM builds both come from this version.
# Checksums are from the release's signed SHA256SUMS file:
#   https://release.files.ghostty.org/libghostty-vt/1.0.1/SHA256SUMS
version = "1.0.1"
base-url = "https://release.files.ghostty.org/libghostty-vt"
source-sha256 = "333dfce97641ef9b536bb9e08907ad86abaaada50e8f7417b70d9284adef37aa"
deps-sha256 = "91a4e10960a52bf5bf4b15aa2a2cddaff8a89d6cd903d3055bda4fd17de3356d"

[zig]
